<div class="body"><h3>${SECS[sec]}</h3>${conteudo(s,sec)}</div>`;

function tog(id,sec){fav=fav.includes(id)?fav.filter(x=>x!=id):[...fav,id];saveFav();openS(id,sec);render()}
function closeS(){$("#modal").classList.remove("open")}
$("#modal").addEventListener("click",e=>{if(e.target.id=="modal")closeS()});
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeS()});
const Q=[
{q:"Qual santo é chamado de Doutor da Graça e escreveu as Confissões?",o:["Padre Pio","Santo Agostinho","Carlo Acutis"],a:1},
{q:"Qual destas é a padroeira do Brasil?",o:["Nossa Senhora Aparecida","Nossa Senhora de Guadalupe","Nossa Senhora de Fátima"],a:0},
{q:"Quem é lembrado como o jovem ligado à Eucaristia e à internet?",o:["Santa Teresinha","Carlo Acutis","Padre Pio"],a:1}
];
let qi=0,pts=0;
function quiz(){
const m=$("#main");
if(qi>=Q.length){m.innerHTML=`<div class="quiz"><h3>Você acertou ${pts} de ${Q.length}</h3><button class="opt" onclick="qi=0;pts=0;quiz()">Tentar de novo</button></div>`;return}
const q=Q[qi];
m.innerHTML=`<div class="quiz"><small>Pergunta ${qi+1} de ${Q.length}</small><h3>${q.q}</h3>`+q.o.map((o,i)=>`<button class="opt" onclick="ans(this,${i})">${o}</button>`).join("")+`</div>`;
}
function ans(b,i){
const q=Q[qi],bs=document.querySelectorAll(".opt");
bs.forEach((x,j)=>{x.disabled=true;if(j==q.a)x.classList.add("ok")});
if(i==q.a)pts++;else b.classList.add("no");
setTimeout(()=>{qi++;quiz()},1100);
}
let ok=0;function entrar(){if(ok)return;ok=1;const i=$("#intro");i.classList.add("out");document.body.classList.remove("lock");setTimeout(()=>i.remove(),1400)}
addEventListener("pointermove",e=>{const r=document.documentElement.style;r.setProperty("--mx",e.clientX+"px");r.setProperty("--my",e.clientY+"px");r.setProperty("--px",(e.clientX/innerWidth-.5)*-26);r.setProperty("--py",(e.clientY/innerHeight-.5)*-26)});
document.body.classList.add("lock");
function conteudo(s,sec){const k=["bio","feitos","milagres","ens","oracao"][sec],c=(DET[s.id]||{})[k];
if(!c)return `<div class="ph-text">Conteúdo de ${SECS[sec].toLowerCase()} em breve.</div>`;
return Array.isArray(c)?`<ul class="lst">${c.map(i=>`<li>${i}</li>`).join("")}</ul>`:c.split("\n").map(p=>`<p>${p}</p>`).join("")}
const DET={
carlo:{bio:"Carlo Acutis nasceu em Londres, em 3 de maio de 1991, filho de pais italianos, e cresceu em Milão. Desde criança tinha um carinho especial pela Eucaristia e pedia para ir à missa todos os dias.\nGostava de futebol, videogame e programação. Usou esse talento para criar um site que reúne milagres eucarísticos de vários países, que depois virou exposição itinerante. Dizia que a Eucaristia era a sua “autoestrada para o céu”.\nEm outubro de 2006, aos 15 anos, adoeceu de uma leucemia fulminante e morreu em 12 de outubro, oferecendo seus sofrimentos pela Igreja e pelo Papa. Foi beatificado em Assis em 2020 e canonizado em 7 de setembro de 2025, o primeiro santo millennial.",
feitos:["Ia à missa e comungava todos os dias, e rezava o terço diariamente.","Criou a exposição e o site <b>Os milagres eucarísticos do mundo</b>, com mais de cem milagres catalogados, que percorreu vários continentes.","Usava programação, sites e vídeos para aproximar as pessoas de Jesus.","Ajudava colegas excluídos e pessoas em situação de rua, doando o que tinha.","Durante a doença, ofereceu seus sofrimentos pela Igreja e pelo Papa.","Foi canonizado em 7 de setembro de 2025, o primeiro santo millennial."],
milagres:["A Igreja reconheceu oficialmente dois milagres atribuídos à sua intercessão.","<b>Beatificação (2020):</b> a cura de Mattheus Vianna, menino de Campo Grande (MS), nascido com uma malformação no pâncreas. Após orações a Carlo e contato com uma relíquia dele, em 2010, ele se recuperou de forma considerada inexplicável.","<b>Canonização (2024):</b> a recuperação de Valeria Valverde, jovem costarriquenha que estudava em Florença e sofreu um grave acidente de bicicleta em 2022, com hemorragia cerebral. Sua mãe rezou no túmulo de Carlo, em Assis.","Esses casos passaram por análise médica e teológica do Vaticano antes de serem reconhecidos."],
ens:["<b>Eucaristia:</b> para ele era a “autoestrada para o céu”, o centro da vida cristã.","<b>Projeção de vida:</b> “estar sempre unido a Jesus”, frase que resume sua espiritualidade.","<b>Autenticidade:</b> uma frase atribuída a ele diz que todos nascem originais, mas muitos morrem como fotocópias.","<b>Sacramentos:</b> missa frequente, confissão regular e terço diário.","<b>Tecnologia a serviço do bem:</b> usar a internet para evangelizar, não só para se distrair.","<b>Caridade:</b> amar de modo concreto os pobres e os que sofrem."],
oracao:"Ele rezava o terço todos os dias e fazia adoração ao Santíssimo Sacramento.\nOração simples, inspirada em sua vida (sem caráter oficial): “Carlo, jovem da Eucaristia, ajuda-me a amar a Missa e a usar o que sei para aproximar os outros de Jesus. Amém.”"},
agostinho:{bio:"Agostinho nasceu em 13 de novembro de 354, em Tagaste, no norte da África (hoje Argélia). Seu pai, Patrício, era pagão; sua mãe, Santa Mônica, rezou por ele durante anos. Brilhante em retórica, estudou em Cartago, viveu uma juventude inquieta, teve um filho, Adeodato, e seguiu o maniqueísmo por cerca de nove anos.\nLecionou em Roma e Milão, onde ouviu as pregações de Santo Ambrósio e aproximou-se da fé cristã. Em 386, num jardim em Milão, ouviu uma voz de criança dizendo “toma e lê”, abriu as cartas de São Paulo e decidiu converter-se. Foi batizado por Ambrósio na Vigília Pascal de 387. Pouco depois, Mônica morreu em Óstia.\nVoltou à África, foi ordenado padre em Hipona (391) e tornou-se bispo da cidade (395-396). Governou, pregou e escreveu até morrer, em 28 de agosto de 430, com Hipona cercada pelos vândalos.",
feitos:["Converteu-se em Milão (386) e foi batizado por Santo Ambrósio (387).","Fundou uma comunidade monástica em Tagaste; sua Regra inspira até hoje as ordens agostinianas.","Foi padre e depois bispo de Hipona, atendendo pobres, ensinando e julgando causas.","Combateu o maniqueísmo, o donatismo e o pelagianismo.","Escreveu as <b>Confissões</b>, <b>A Cidade de Deus</b>, <b>Sobre a Trindade</b> e centenas de sermões.","É Doutor da Igreja, conhecido como o Doutor da Graça."],
milagres:["Agostinho é lembrado mais pela obra e pela conversão do que por milagres espetaculares.","Seu primeiro biógrafo, Possídio, conta que ele curou um enfermo com oração e imposição das mãos.","Em <b>A Cidade de Deus</b> (livro XXII), ele mesmo registra curas ligadas às relíquias de Santo Estêvão em sua diocese.","A história da criança que tentava esvaziar o mar com uma conchinha é uma lenda piedosa, sem base histórica.","A conversão de Agostinho, fruto das orações de Santa Mônica, é vista pela tradição como a grande “graça” de sua vida."],
ens:["<b>Deus é o descanso do coração:</b> “nosso coração está inquieto enquanto não repousa em ti” (Confissões I,1).","<b>Graça:</b> a salvação é dom de Deus; não se conquista só com esforço humano.","<b>Fé e razão:</b> crer para compreender, compreender para crer.","<b>Interioridade:</b> Deus se encontra dentro de nós, na memória, no pensamento e no amor.","<b>Duas cidades:</b> a do amor a Deus e a do amor de si; a história é marcada por essas duas direções.","<b>Amor:</b> ama e faz o que quiseres, pois o amor verdadeiro só busca o bem."],
oracao:"Tarde te amei, ó Beleza tão antiga e tão nova, tarde te amei!\nFizeste-nos para ti, Senhor, e o nosso coração vive inquieto enquanto não repousa em ti.\n(Santo Agostinho, Confissões, livros I e X)"},
pio:{bio:"Francesco Forgione nasceu em 25 de maio de 1887, em Pietrelcina, no sul da Itália, numa família simples de camponeses. Aos 15 anos entrou na Ordem dos Frades Menores Capuchinhos e recebeu o nome de frei Pio. Foi ordenado padre em 1910.\nA partir de 1916 viveu no convento de San Giovanni Rotondo. Em 1918, segundo os relatos, recebeu os estigmas, as marcas da Paixão de Cristo. Atraiu multidões que buscavam confissão e conselho, e passava muitas horas por dia no confessionário.\nEnfrentou investigações e restrições da Igreja, depois suspensas. Fundou o hospital Casa Sollievo della Sofferenza (1956) e os Grupos de Oração. Morreu em 23 de setembro de 1968 e foi canonizado por São João Paulo II em 16 de junho de 2002.",
feitos:["Passava longas horas por dia confessando e celebrando a missa, atendendo multidões.","Segundo os relatos, recebeu os estigmas em 1918 e os carregou por cerca de 50 anos.","Fundou a Casa Sollievo della Sofferenza, hospital inaugurado em 1956 para cuidar dos doentes.","Criou os Grupos de Oração de Padre Pio, hoje espalhados pelo mundo.","Obedeceu com humildade às restrições impostas ao seu ministério.","Foi canonizado em 2002."],
milagres:["<b>Estigmas:</b> feridas nas mãos, nos pés e no lado, relatadas desde 1918 e examinadas por médicos. A Igreja investigou o caso com cautela.","<b>Beatificação:</b> a cura de Consiglia De Martino, em 1995, de uma grave lesão no canal torácico.","<b>Canonização:</b> a cura do menino Matteo Pio Colella, em 2000, de uma meningite fulminante.","Há muitos relatos populares de bilocação e de conhecimento de corações. São tradição devocional, não milagres reconhecidos oficialmente."],
ens:["<b>Oração e confiança:</b> uma frase atribuída a ele resume: reza, espera e não te preocupes.","<b>Confissão:</b> via de cura e reconciliação, onde passou boa parte da vida.","<b>Eucaristia:</b> celebrava a missa com muita devoção, vivendo-a como entrega.","<b>Maria e o terço:</b> recomendava rezar o terço sempre.","<b>Sofrimento com amor:</b> unir as dores à cruz de Cristo e servir os doentes."],
oracao:"Ele é lembrado por uma oração após a comunhão, em que pede a Jesus que permaneça com ele para que não o esqueça. O texto completo será incluído na aba Orações."},
teresinha:{bio:"Teresa Martin nasceu em Alençon, França, em 2 de janeiro de 1873, a caçula de nove irmãos. Seus pais, Luís e Zélia Martin, foram canonizados em 2015. Perdeu a mãe aos 4 anos e cresceu em Lisieux, rodeada de carinho e de uma sensibilidade intensa.\nAos 15 anos entrou no Carmelo de Lisieux, depois de pedir pessoalmente ao Papa Leão XIII a permissão para entrar tão jovem. Ali viveu como Irmã Teresa do Menino Jesus e da Santa Face, numa vida escondida de oração e pequenos gestos de amor.\nDescobriu a “pequena via”, o caminho da confiança e da simplicidade, e a descreveu em sua autobiografia, <i>História de uma Alma</i>. Morreu de tuberculose em 30 de setembro de 1897, aos 24 anos. Foi canonizada em 1925 e declarada Doutora da Igreja em 1997 por São João Paulo II.",
feitos:["Aos 14 anos, pediu ao Papa Leão XIII, em audiência, para entrar no Carmelo antes da idade; entrou em 1888.","Viveu nove anos no Carmelo, entre oração, tarefas simples e o cuidado com as noviças.","Escreveu a <i>História de uma Alma</i>, publicada após sua morte e traduzida para dezenas de línguas.","Rezou e ofereceu sacrifícios pelos missionários.","É Padroeira das Missões (1927, com São Francisco Xavier) e Doutora da Igreja (1997)."],
milagres:["<b>Cura na infância (1883):</b> doente gravemente, ela relatou ter se curado ao rezar diante de uma imagem de Nossa Senhora, que lhe sorriu.","<b>Conversão de Henri Pranzini (1887):</b> o condenado, ao ser executado, beijou o crucifixo; ela atribuiu o gesto às suas orações.","<b>Chuva de rosas:</b> ela prometeu passar o céu fazendo o bem na terra. Muitos devotos relatam graças e rosas como sinal.","A Igreja reconheceu curas atribuídas a ela para sua beatificação e canonização."],
ens:["<b>Pequena via:</b> fazer as coisas pequenas com grande amor.","<b>Infância espiritual:</b> confiar em Deus como uma criança nos braços do Pai.","<b>Vocação do amor:</b> descobriu que sua missão é o amor, no coração da Igreja.","<b>Fraqueza:</b> Deus age justamente na nossa pequenez.","<b>Missão pela oração:</b> a oração e o sacrifício sustentam a Igreja."],
oracao:"Ela é autora do Ato de Oferecimento ao Amor Misericordioso (1895), uma oração em que se entrega totalmente a Deus. O texto completo será incluído na aba Orações."},
aparecida:{bio:"Em outubro de 1717, três pescadores, Domingos Garcia, Filipe Pedroso e João Alves, lançaram suas redes no rio Paraíba do Sul para preparar um banquete à passagem do governador da capitania, o Conde de Assumar. Sem pegar nada, apanharam primeiro o corpo e depois a cabeça de uma pequena imagem de Nossa Senhora da Conceição. Em seguida, as redes ficaram cheias de peixes.\nA imagem, de barro e com cerca de 36 cm, escureceu com o tempo e a devoção cresceu entre o povo. Primeiro rezada em casas, depois em capela e basílica, tornou-se a imagem mais querida do Brasil.\nEm 1930, o Papa Pio XI a proclamou Padroeira do Brasil. Sua festa é celebrada em 12 de outubro, e a Basílica Nacional, em Aparecida (SP), recebe milhões de romeiros por ano.",
feitos:["Em 1717, três pescadores encontraram a imagem no rio Paraíba do Sul.","Ao longo do século XVIII, a devoção cresceu e foram construídas capelas para acolher os romeiros.","Em 1904, a imagem recebeu a coroação canônica.","Em 1930, foi proclamada Padroeira do Brasil pelo Papa Pio XI.","Em 1980, São João Paulo II consagrou a Basílica Nacional; Bento XVI (2007) e Francisco (2013) também visitaram o santuário."],
milagres:["<b>Pesca farta (1717):</b> o relato fundador conta que, após encontrar a imagem, as redes se encheram de peixes.","<b>Milagre das correntes:</b> a tradição conta que um escravizado, Zacarias, teve as correntes soltas ao rezar diante da imagem.","<b>Fato histórico (1978):</b> a imagem foi quebrada em muitos pedaços por um homem e depois restaurada.","Os relatos de milagres são da devoção popular. A Igreja aprova o culto à imagem, sem impor crença em cada história."],
ens:["<b>Mãe que acolhe:</b> a devoção nasceu entre pescadores e escravizados, os pequenos e esquecidos.","<b>Maria leva a Jesus:</b> “fazei tudo o que ele vos disser” (Jo 2,5).","<b>Providência:</b> a pesca farta lembra que Deus cuida de quem confia.","<b>Povo unido:</b> romarias e oração em comunidade."],
oracao:"Na devoção a Nossa Senhora Aparecida costuma-se rezar a Ave Maria, a Salve Rainha, o terço e a Ladainha de Nossa Senhora. A oração própria à Padroeira será incluída na aba Orações."},
guadalupe:{bio:"Em dezembro de 1531, no monte Tepeyac, perto da Cidade do México, a Virgem Maria teria aparecido a Juan Diego, indígena recém-convertido, falando em náuatle, sua língua. Ela pediu que se construísse ali uma igreja.\nComo o bispo Juan de Zumárraga pediu um sinal, Juan Diego levou flores colhidas fora de época em sua tilma (manto). Ao abri-la diante do bispo, a imagem de Nossa Senhora apareceu estampada no tecido.\nA tilma é venerada na Basílica de Guadalupe, uma das igrejas mais visitadas do mundo. Juan Diego foi canonizado em 2002 por São João Paulo II. Nossa Senhora de Guadalupe é Padroeira das Américas, com festa em 12 de dezembro.",
feitos:["Em 1531, no Tepeyac, apareceu a Juan Diego e pediu que se erguesse ali uma igreja.","Falou na língua indígena do vidente, valorizando sua cultura.","Foi chamada Imperatriz das Américas por Pio XII (1945) e Padroeira das Américas por São João Paulo II (1999).","Juan Diego foi canonizado em 31 de julho de 2002.","A Basílica de Guadalupe, na Cidade do México, é um dos santuários mais visitados do mundo."],
milagres:["<b>Rosas fora de época:</b> em pleno inverno, Juan Diego colheu flores no monte, como sinal para o bispo.","<b>A tilma:</b> segundo a tradição, a imagem apareceu no manto de fibra vegetal e se conserva há séculos.","<b>Cura de Juan Bernardino:</b> o tio de Juan Diego, gravemente doente, foi curado, segundo o relato tradicional.","Historiadores debatem a historicidade das aparições. A Igreja aprova o culto e a devoção."],
ens:["<b>Mãe de todos:</b> o relato lembra as palavras de Maria: não estou eu aqui, que sou tua mãe?","<b>Dignidade dos pequenos:</b> Deus escolhe os humildes, como Juan Diego.","<b>Encontro de culturas:</b> a fé acolhe e abraça os povos.","<b>Vida:</b> invocada como protetora da vida nascente."],
oracao:"Os devotos rezam a Ave Maria, a Salve Rainha e o terço diante da imagem. A oração própria a Nossa Senhora de Guadalupe será incluída na aba Orações."},
fatima:{bio:"Em 1916, três crianças pastores de Fátima, em Portugal, Lúcia dos Santos e seus primos Francisco e Jacinta Marto, receberam a visita de um anjo que as preparou para rezar e oferecer sacrifícios.\nEm 13 de maio de 1917, na Cova da Iria, relataram ter visto uma Senhora “mais brilhante que o sol”. Ela voltou todo dia 13, de maio a outubro (em agosto foi no dia 19), pedindo oração, penitência e o rosário diário pela paz e pela conversão. Em 13 de outubro, milhares de pessoas presenciaram o “milagre do sol”.\nFrancisco e Jacinta morreram nos anos seguintes e foram canonizados em 2017. Lúcia tornou-se religiosa carmelita e faleceu em 2005. A Igreja aprovou o culto a Nossa Senhora de Fátima em 1930.",
feitos:["Em 1916, um anjo apareceu três vezes aos pastorinhos, ensinando a rezar e a adorar.","Entre 13 de maio e 13 de outubro de 1917, a Senhora apareceu seis vezes na Cova da Iria.","Pediu oração, penitência e o terço diário pela paz e pela conversão.","Em 1930, a Igreja aprovou o culto; o Santuário de Fátima recebe milhões de peregrinos.","Em 13 de maio de 1981, São João Paulo II sobreviveu a um atentado e atribuiu isso a Nossa Senhora de Fátima."],
milagres:["<b>Milagre do sol (13/10/1917):</b> milhares de pessoas relataram ver o sol girar e mudar de cor. Cientistas e historiadores discutem a explicação.","<b>Beatificação (2000):</b> a cura de Maria Emília Santos, em 1987, atribuída a Francisco e Jacinta.","<b>Canonização (2017):</b> a cura de Lucas Batista, menino de Juranda (PR), que sofreu uma queda grave em 2013 e se recuperou de forma considerada inexplicável.","A Igreja reconhece as aparições como dignas de fé, sem obrigar os fiéis a acreditar nelas."],
ens:["<b>Terço diário:</b> rezar pela paz no mundo e pela conversão.","<b>Penitência:</b> oferecer pequenos sacrifícios com amor.","<b>Reparação:</b> rezar por quem não reza.","<b>Imaculado Coração de Maria:</b> um caminho seguro até Jesus.","<b>Confiança dos pequenos:</b> Deus se revela aos simples."],
oracao:"Oração do Anjo de Portugal (1916): “Meu Deus, eu creio, adoro, espero e amo-vos. Peço-vos perdão para os que não creem, não adoram, não esperam e não vos amam.”"}
};
const WD=[["EUCARISTIA","Corpo de Cristo"],["ROSARIO","Oração com contas, meditando os mistérios"],["BATISMO","Primeiro sacramento, que nos faz filhos de Deus"],["APOSTOLO","Um dos doze enviados por Jesus"],["PENTECOSTES","Descida do Espírito Santo sobre os apóstolos"],["ADVENTO","Tempo de preparação para o Natal"],["QUARESMA","Quarenta dias de preparação para a Páscoa"],["CRISMA","Sacramento que confirma o batismo"],["BASILICA","Título de uma igreja importante, como a de Aparecida"],["CONFISSAO","Sacramento da reconciliação"],["HOSTIA","Pão consagrado na missa"],["TRINDADE","Um só Deus em três pessoas"],["ALELUIA","Aclamação de alegria antes do Evangelho"],["PADROEIRA","Nossa Senhora Aparecida é a ___ do Brasil"]];
WD.push(["PAPA","Sucessor de São Pedro"],["CRUZ","Símbolo da fé cristã, onde Jesus foi crucificado"],["EVANGELHO","Boa-Nova anunciada por Jesus"],["RESSURREICAO","Vitória de Cristo sobre a morte"],["ESPIRITOSANTO","Terceira Pessoa da Santíssima Trindade"],["SACRAMENTO","Sinal visível da graça de Deus"],["PURGATORIO","Estado de purificação antes de entrar no céu"],["ANUNCIACAO","O anjo Gabriel visita Maria"],["TRANSUBSTANCIACAO","Mudança do pão e do vinho no Corpo e Sangue de Cristo"],["IMACULADACONCEICAO","Dogma sobre Maria, concebida sem pecado original"]);
let G=null,gOrd=[],gi=0;
function nova(){if(gi>=gOrd.length){gOrd=WD.map((_,i)=>i).sort(()=>Math.random()-.5);gi=0}const[w,h]=WD[gOrd[gi++]];G={w,h,rows:[],cur:"",over:0,keys:{},msg:"",anim:-1}}
function aval(g,w){const r=Array(w.length).fill("no"),c={};for(let i=0;i<w.length;i++)if(g[i]==w[i])r[i]="ok";else c[w[i]]=(c[w[i]]||0)+1;for(let i=0;i<w.length;i++)if(r[i]!="ok"&&c[g[i]]>0){r[i]="has";c[g[i]]--}return r}
function msg(t){G.msg=t;jogo(1);setTimeout(()=>{if(G&&G.msg==t){G.msg="";if(aba=="quiz")jogo(1)}},1600)}
function tecla(k){if(!G||G.over)return;const n=G.w.length;
if(k=="ENTER"){if(G.cur.length<n){msg("Faltam letras");return}
const r=aval(G.cur,G.w);G.rows.push([G.cur,r]);G.cur.split("").forEach((l,i)=>{const o=G.keys[l],v=r[i];if(o!="ok"&&!(o=="has"&&v=="no"))G.keys[l]=v});
G.anim=G.rows.length-1;if(G.cur==G.w)G.over=1;else if(G.rows.length>=6)G.over=2;G.cur=""}
else if(k=="DEL")G.cur=G.cur.slice(0,-1);else if(G.cur.length<n)G.cur+=k;
jogo(1)}
function jogo(keep){if(!G||!keep)nova();const n=G.w.length;let rows="";
for(let r=0;r<6;r++){const d=G.rows[r],cur=r==G.rows.length&&!G.over;let cells="";
for(let i=0;i<n;i++){let l="",c="";if(d){l=d[0][i];c=d[1][i]+(G.anim==r?" flip":"")}else if(cur){l=G.cur[i]||"";c=l?"fil"+(i==G.cur.length-1?" typ":""):""}
cells+=`<i class="cell ${c}" style="animation-delay:${i*.18}s">${l}</i>`}rows+=`<div class="row" style="--n:${n}">${cells}</div>`}
G.anim=-1;
const kb=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"].map((r,ri)=>`<div class="kr">`+(ri==2?`<button class="k w" data-k="ENTER">Enter</button>`:"")+r.split("").map(l=>`<button class="k ${G.keys[l]||""}" data-k="${l}">${l}</button>`).join("")+(ri==2?`<button class="k w" data-k="DEL">⌫</button>`:"")+`</div>`).join("");
const fim=G.over?`<div class="fim"><b>${G.over==1?"Parabéns! 🙏":"Não foi dessa vez"}</b><p>A palavra era <strong>${G.w}</strong>.</p><button class="cta" onclick="jogo()">Próxima palavra</button></div>`:"";
$("#main").innerHTML=`<div class="game"><p class="intro">Descubra a palavra católica em 6 tentativas.</p><div class="dica"><small>DICA · ${n} LETRAS</small><br>${G.h}</div><div class="msg">${G.msg}</div><div class="board">${rows}</div>${fim}<div class="kbd">${kb}</div></div>`}
document.addEventListener("click",e=>{const k=e.target.closest(".k");if(k)tecla(k.dataset.k)});
addEventListener("keydown",e=>{if(aba!="quiz"||document.getElementById("intro")||$("#modal").classList.contains("open")||e.ctrlKey||e.metaKey||e.altKey)return;let k=e.key;if(k=="Enter")k="ENTER";else if(k=="Backspace")k="DEL";else{k=k.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();if(!/^[A-Z]$/.test(k))return}e.preventDefault();tecla(k)});
let vt=null,vp=0,vd=1,vpause=0;
function vit(d){const t=$("#trk");if(!t)return;const c=t.querySelector(".card"),w=(c?c.offsetWidth:232)+22;t.scrollBy({left:d*w,behavior:"smooth"});vpause=performance.now()+4000}
function vitInit(){cancelAnimationFrame(vt);const t=$("#trk");if(!t)return;vp=t.scrollLeft;vd=1;vpause=0;
const st=()=>{vpause=performance.now()+4000},cm=matchMedia("(prefers-reduced-motion:reduce)").matches;
["pointerdown","wheel","touchstart"].forEach(v=>t.addEventListener(v,st,{passive:true}));
t.addEventListener("pointerenter",e=>{if(e.pointerType=="mouse")vpause=Infinity});t.addEventListener("pointerleave",st);
const step=()=>{const t=$("#trk");if(!t)return;
if(!cm&&performance.now()>vpause&&!document.querySelector("#modal.open")){const mx=t.scrollWidth-t.clientWidth;if(mx>4){if(Math.abs(t.scrollLeft-vp)>2)vp=t.scrollLeft;vp+=vd*.45;if(vp>=mx){vp=mx;vd=-1}else if(vp<=0){vp=0;vd=1}t.scrollLeft=vp}}
vt=requestAnimationFrame(step)};vt=requestAnimationFrame(step)}
function jogo(keep){if(!G||!keep)nova();
if(keep&&$("#bd")){draw();return}
const n=G.w.length;
const kb=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"].map((r,ri)=>`<div class="kr">`+(ri==2?`<button class="k w" data-k="ENTER">ENTER</button>`:"")+r.split("").map(l=>`<button class="k" data-k="${l}">${l}</button>`).join("")+(ri==2?`<button class="k w" data-k="DEL">⌫</button>`:"")+`</div>`).join("");
$("#main").innerHTML=`<div class="game"><div class="gbar"><i></i><b>JOGO DA PALAVRA</b><button onclick="$('#aj').classList.toggle('on')" aria-label="Ajuda">?</button></div><div id="aj">Descubra a palavra católica a partir da dica, em 6 tentativas. <b>Verde:</b> letra certa no lugar certo. <b>Dourado:</b> a letra existe, mas em outro lugar. <b>Cinza:</b> a letra não está na palavra.</div><div class="dica"><small>DICA · ${n} LETRAS</small><br>${G.h}</div><div class="msg" id="ms"></div><div class="board" id="bd"></div><div id="fim"></div><div class="kbd" id="kb">${kb}</div></div>`;G._f=0;draw()}
function draw(){const n=G.w.length;let h="";
G.rows.forEach((d,r)=>{h+=`<div class="row" style="--n:${n}">`+d[0].split("").map((l,i)=>`<i class="cell ${d[1][i]}${G.anim==r?" flip":""}" style="animation-delay:${i*.14}s">${l}</i>`).join("")+`</div>`});
if(!G.over)h+=`<div class="row" style="--n:${n}">`+G.cur.split("").map((l,i)=>`<i class="cell fil${i==G.cur.length-1?" typ":""}">${l}</i>`).join("")+`<b class="cur"></b></div>`;
$("#bd").innerHTML=h;G.anim=-1;$("#ms").textContent=G.msg;
document.querySelectorAll(".k[data-k]").forEach(b=>{const c=G.keys[b.dataset.k];b.className="k"+(b.dataset.k.length>1?" w":"")+(c?" "+c:"")});
if(G._f!==G.over){G._f=G.over;$("#fim").innerHTML=G.over?`<div class="fim"><b>${G.over==1?"Parabéns! 🙏":"Não foi dessa vez"}</b><p>A palavra era <strong>${G.w}</strong>.</p><button class="cta" onclick="jogo()">Próxima palavra</button></div>`:""}}
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function dia(){
const d=new Date(),n=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
const fd=s=>{const p=s.feast.replace("º","").split(" de ");return[+p[0],MES.indexOf(p[1])]};
const hoje=S.find(s=>{const f=fd(s);return f[0]==d.getDate()&&f[1]==d.getMonth()});
const s=hoje||S[n%S.length];
$("#main").innerHTML=`<p class="intro">${d.getDate()} de ${MES[d.getMonth()]} de ${d.getFullYear()}</p><div class="dia"><img src="${IMG[s.img]}" alt="${s.n}"><div><small>${hoje?"Hoje é a festa deste santo":"Santo em destaque de hoje"}</small><h2>${s.n}</h2><p>${s.lead}</p><p class="mut">Festa: ${s.feast}</p><button class="cta" onclick="openS('${s.id}')">Conhecer a história</button></div></div>`}
const PRAY=[
{t:"Pai-Nosso",a:"Jesus Cristo (Mt 6,9-13)",x:"Pai nosso que estais nos céus,\nsantificado seja o vosso nome;\nvenha a nós o vosso reino,\nseja feita a vossa vontade\nassim na terra como no céu.\nO pão nosso de cada dia nos dai hoje;\nperdoai-nos as nossas ofensas\nassim como nós perdoamos a quem nos tem ofendido;\ne não nos deixeis cair em tentação,\nmas livrai-nos do mal. Amém."},
{t:"Ave Maria",a:"Saudação do anjo Gabriel e de Santa Isabel (Lc 1) · forma tradicional",x:"Ave Maria, cheia de graça,\no Senhor é convosco;\nbendita sois vós entre as mulheres\ne bendito é o fruto do vosso ventre, Jesus.\nSanta Maria, Mãe de Deus,\nrogai por nós, pecadores,\nagora e na hora da nossa morte. Amém."},
{t:"Salve Rainha",a:"Tradição atribuída a Hermano Contracto (séc. XI)",x:"Salve, Rainha, Mãe de misericórdia,\nvida, doçura e esperança nossa, salve!\nA vós bradamos, os degredados filhos de Eva;\na vós suspiramos, gemendo e chorando\nneste vale de lágrimas.\nEia, pois, advogada nossa,\nesses vossos olhos misericordiosos a nós volvei;\ne depois deste desterro, mostrai-nos Jesus,\nbendito fruto do vosso ventre,\nó clemente, ó piedosa, ó doce sempre Virgem Maria."},
{t:"Oração da Paz",a:"Atribuída a São Francisco de Assis (autoria anônima, início do séc. XX)",x:"Senhor, fazei de mim um instrumento de vossa paz.\nOnde houver ódio, que eu leve o amor;\nonde houver ofensa, que eu leve o perdão;\nonde houver discórdia, que eu leve a união;\nonde houver dúvida, que eu leve a fé;\nonde houver erro, que eu leve a verdade;\nonde houver desespero, que eu leve a esperança;\nonde houver tristeza, que eu leve a alegria;\nonde houver trevas, que eu leve a luz.\nÓ Mestre, fazei que eu procure mais consolar que ser consolado;\ncompreender que ser compreendido;\namar que ser amado.\nPois é dando que se recebe,\né perdoando que se é perdoado,\ne é morrendo que se vive para a vida eterna."},
{t:"Nada te perturbe",a:"Santa Teresa de Ávila",x:"Nada te perturbe,\nnada te espante,\ntudo passa.\nDeus não muda.\nA paciência tudo alcança.\nQuem a Deus tem, nada lhe falta.\nSó Deus basta."},
{t:"Tarde te amei",a:"Santo Agostinho · Confissões, livro X",x:"Tarde te amei, ó Beleza tão antiga e tão nova,\ntarde te amei!"},
{t:"Fica comigo, Senhor",a:"Padre Pio de Pietrelcina",x:"Texto em breve."}
];
function oracoes(){
$("#main").innerHTML=`<p class="intro">${ABAS.find(x=>x.k=="oracoes").d}</p><div class="prayers">`+PRAY.map((p,i)=>`<details class="pr" style="animation-delay:${i*60}ms"><summary><span><b>${p.t}</b><em>${p.a}</em></span></summary><div class="pt">${p.x}<br><button class="cta" onclick="cp(${i},this)">Copiar oração</button></div></details>`).join("")+`</div>`}
function cp(i,b){try{navigator.clipboard.writeText(PRAY[i].t+" · "+PRAY[i].a+"\n\n"+PRAY[i].x).then(()=>{b.textContent="Copiado ✓"})}catch(e){}}
document.addEventListener("click",e=>{const b=e.target.closest("button,summary");if(!b)return;const r=b.getBoundingClientRect(),i=document.createElement("i");i.className="rip";i.style.left=e.clientX-r.left+"px";i.style.top=e.clientY-r.top+"px";b.appendChild(i);setTimeout(()=>i.remove(),600)});
const cv=document.getElementById("stars"),cx=cv.getContext("2d"),calm=matchMedia("(prefers-reduced-motion:reduce)").matches;let W,H,st=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;st=Array.from({length:Math.round(W*H/8000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,p:Math.random()*6.28,v:.006+Math.random()*.02,c:Math.random()<.08}))}
function tick(t){cx.clearRect(0,0,W,H);for(const s of st){const a=.25+.75*(.5+.5*Math.sin(s.p+t*s.v));if(s.c){cx.strokeStyle=`rgba(232,190,90,${a})`;cx.lineWidth=1.4;cx.beginPath();cx.moveTo(s.x-5,s.y);cx.lineTo(s.x+5,s.y);cx.moveTo(s.x,s.y-5);cx.lineTo(s.x,s.y+5);cx.stroke()}else{cx.fillStyle=`rgba(235,225,255,${a})`;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fill()}}if(!calm)requestAnimationFrame(tick)}
size();addEventListener("resize",()=>{size();if(calm)tick(0)});requestAnimationFrame(tick);
render();
</script>
